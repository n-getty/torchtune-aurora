          ab_override: TORCHTUNE_EP_CPU_VECTOR_ROUTING_METADATA=0
          fixed_controls: [TORCHTUNE_EP_DEVICE_ROUTING_METADATA, metadata_transport, routing_index_mode]
          note: Uses vectorized contiguous-range expansion on CPU routing counts, avoiding Python list/range expansion per layer while preserving the established CPU collective and accelerator materialization path.
        - change: packed_cpu_routing_metadata_transfer
          files: [torchtune/modules/moe/_parallelism.py, tests/torchtune/dev/rl/test_ep_all2all_dispatch_equivalence.py]
          promotion_status: not_claimed
