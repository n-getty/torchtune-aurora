name: qwen3_moe_reframed_evaluation
schema_version: 1
result_classes: [kernel_parity, ep_scaling, capacity_value]
decision_categories: [highest_repeatable_moe_per_gpu_mfu, highest_aggregate_throughput, best_ep_scaling_point, closest_strict_dense_parity, best_capacity_value_result]
gap_categories: [communication, expert_compute, attention, optimizer, pipeline_bubble]
reference_tier:
  result_class: kernel_parity
  moe: Qwen3-30B-A3B
  dense: Qwen3-4B
  sequence_length: 4096
  promotion_threshold_percent: 95
  validated_moe_baseline:
    ep: 8
    pp: 1
    local_batch: 1
    throughput_tokens_per_second_per_gpu: 729.53
    mfu_percent: 3.52
  notes: EP16 and PP2 remain rejected for this workload; EP8 batch 2 is approximately 803.13 tok/s/GPU but below matched parity.
tracks:
  kernel_parity:
    manifest: experiments/qwen3_moe/native_ep8_seq4096_baseline_manifest.yaml
    standalone_manifest: experiments/qwen3_moe/kernel_parity_manifest.yaml
    primary_metrics: [throughput_tokens_per_second_per_gpu, mfu_percent]
    promotion_evaluator: experiments/qwen3_moe/report_kernel_parity.py
    optimization_ab_report: experiments/qwen3_moe/report_optimization_ab.py
    controls: [qwen3_30b_a3b_ep8, qwen3_4b_dense]
  ep_scaling:
    status: launchers_ready_pending_hardware_measurement
    standalone_manifest: experiments/qwen3_moe/ep_scaling_manifest.yaml
    measurement_launchers:
      ep8_node_local: experiments/qwen3_moe/run_native_ep8_measurement.pbs
      ep16_two_node: experiments/qwen3_moe/run_native_ep16_measurement.pbs
    measurement_artifact:
      output_template: experiments/qwen3_moe/measurements/<ep>_<jobid>.rank<rank>.json
      enable_env: TORCHTUNE_MOE_MEASURE=1
      output_env: TORCHTUNE_MOE_MEASURE_OUTPUT
      promotion_run_uses_measurement: false
      aggregation: torchtune.modules.moe.measurement.aggregate_measurement_files
      scaling_summary: torchtune.modules.moe.measurement.summarize_ep_scaling_artifact
      comparison_report: experiments/qwen3_moe/report_ep_scaling.py
      timing_summary: torchtune.modules.moe.measurement.summarize_step_timings
      required_metadata: [source_revision, uncommitted_change_state, model, checkpoint, world_size, topology, sequence_length, batch_size, gradient_accumulation_steps, optimizer, environment_overrides, optimization_profile, routing_index_mode, router_semantics, expert_execution_path, pipeline_stage, device_health, gate_status, semantic_completion, measurement_completion]
      optional_step_timing: TORCHTUNE_MOE_STEP_TIMING=1; reports attention, non_expert, model_fwd_total, backward_total, manual_grad_release_total, optimizer_step_total, pipeline_bubble, activation_transfer_forward/backward, and time_per_step_s once per optimizer step without affecting promotion runs
      pipeline_aggregation: stage-aware; single-stage artifacts retain the legacy records mapping, while PP artifacts are grouped under records_by_pipeline_stage
      completion_seal: required; rank artifacts are sealed only after the measured window exits successfully
      provenance_seal: canonical EP8/EP16 and capacity MoE launchers call mark_measurement_artifacts_complete with require_provenance=true; model, checkpoint, source_revision, and clean-or-dirty worktree state are mandatory
      complete_rank_set: required by report_ep_scaling.py; ranks 0..world_size-1 must all be present
      attribution_validation: optimization_profile and routing_index_mode must be non-empty; TORCHTUNE_EP_ALL2ALL, when recorded, must be 0 or 1; collective locality must be valid and agree with event records; aggregation rejects violations
      scaling_control_validation: EP8 and EP16 summaries must match model, checkpoint, sequence length, batch, optimizer, expert execution, routing, transport, and recorded optimization overrides; only EP degree, world size, topology, and expected locality may differ
      strict_report_validation: report_ep_scaling.py requires complete control metadata before producing a comparison
      optimization_ab_validation: report_optimization_ab.py requires same-topology metadata and an explicit varying-control list
      optimizer_validation: when TORCHTUNE_MOE_OPTIMIZER_COMPONENT is recorded, it must equal resolved optimizer metadata; aggregation rejects mismatches
      metadata_profile_validation: canonical Qwen EP launchers include cpu_vector_routing_metadata_on/off in optimization_profile so matched metadata A/B results remain attributable
      launcher_override_policy: canonical launchers use ${VAR:-default} for optimization flags so matched A/B overrides remain effective and are recorded in environment_overrides; canonical EP8/EP16 measurements default to the validated grouped_mm and AllToAll path; sequential and padded_bmm remain explicit diagnostic controls; default optimization profiles include sequential/padded_bmm/grouped_mm execution, index_add_combine_on/off, index_add_final_scatter_on/off, rowwise_alltoall_unpermute_on/off, uninitialized_alltoall_buffers_on/off, and topk_router_on/off
      controlled_overrides: [TORCHTUNE_EP_ALL2ALL, TORCHTUNE_MOE_COLLECTIVE_LOCALITY, TORCHTUNE_EP_INPLACE_AG_ANCHOR, TORCHTUNE_EP_SINGLE_ROW_AG_ANCHOR, TORCHTUNE_EP_ZERO_COST_AG_ANCHOR, TORCHTUNE_EP_UNINITIALIZED_COLLECTIVE_BUFFERS, TORCHTUNE_EP_UNINITIALIZED_ALLTOALL_BUFFERS, TORCHTUNE_EP_ROWWISE_ALLTOALL_UNPERMUTE, TORCHTUNE_EP_CPU_METADATA_TRANSFER, TORCHTUNE_EP_DIRECT_CPU_COPY, TORCHTUNE_EP_INDEX_ADD_COMBINE, TORCHTUNE_EP_DEVICE_ROUTING_METADATA, TORCHTUNE_EP_CPU_VECTOR_ROUTING_METADATA, TORCHTUNE_EP_PACK_ROUTING_METADATA_TRANSFER, TORCHTUNE_EP_GRAD_RELEASE_XCCL, TORCHTUNE_MOE_SEQUENTIAL_EXPERTS, TORCHTUNE_MOE_GROUPED_EXPERTS, TORCHTUNE_MOE_GROUPED_RECOMPUTE_PREACT, TORCHTUNE_MOE_TOPK_ROUTING, TORCHTUNE_MOE_UNSTABLE_EXPERT_GROUPING, TORCHTUNE_MOE_INDEX_SELECT_PACKING, TORCHTUNE_MOE_INDEX_ADD_FINAL_SCATTER, TORCHTUNE_MOE_VECTOR_PACKING, TORCHTUNE_MOE_ALLTOALL_CONDITIONAL_CONTIGUOUS]
    controls:
      - qwen3_30b_a3b_ep8_node_local
      - qwen3_30b_a3b_ep16_two_node
    required_metrics: [local_tokens, global_tokens, per_gpu_throughput, aggregate_throughput, tokens_per_local_expert, expert_imbalance, expert_execution_path, expert_compute_timing, grouped_gemm_gate, grouped_gemm_up, grouped_gemm_down, router, attention, non_expert, expert_forward, final_scatter, dispatch_alltoall, combine_alltoall, dispatch_backward_alltoall, combine_backward_alltoall, routing_metadata_allgather, routing_metadata_materialization, routing_metadata_permutation, dispatch_pack, dispatch_unpack, dispatch_backward_pack, dispatch_backward_unpack, combine_pack, combine_unpack, combine_backward_pack, combine_backward_unpack, collective_communication, routing_pack_unpack, allgather_forward_optional, reduce_scatter_forward_optional, reduce_scatter_backward_optional, allgather_backward_optional, collective_locality, model_fwd_total, backward_total, manual_grad_release_total, optimizer_step_total, total_step_s, peak_memory, steady_state_memory, device_health]
    grouped_gemm_projection_timings: [grouped_gemm_gate, grouped_gemm_up, grouped_gemm_down]
    expert_compute_timing_policy: "sequential_expert_compute for expert_execution_path=sequential; grouped_gemm_gate/up/down for expert_execution_path=grouped_mm; padded_bmm for expert_execution_path=padded_bmm; TORCHTUNE_MOE_MEASURE=1; excluded from promotion windows"
    collective_metric_policy: canonical_ep_is_alltoall; allgather_reduce_scatter_remains_an_explicit_control; locality_field_records_node_local_or_cross_node
    batch_sweep: [1, 2]
    default_compile: false
    compile_ab_requires_matched_override: true
    larger_token_volume: true
    gradient_accumulation_is_proxy: false
    next_ab:
      hypothesis: removing expert recomputation will recover throughput while the factored optimizer preserves the batch-2 memory envelope
      fixed_controls: [batch_size, ep, sequence_length, flash, compile, alltoall, metadata_off, routing_index_mode, index_select_packing, single_row_ag_anchor, inplace_ag_anchor, uninitialized_collective_buffers, metadata_transport, direct_cpu_copy, inplace_route_weighting, inplace_final_scatter, inplace_swiglu, optimizer]
      required_gates: [fresh_node_collective_health, two_optimizer_step_memory_smoke, twelve_step_semantic_completion]
      gate_order: [collective_preflight, two_step_smoke, measured_window]
      promotion_status: rejected
      rejection:
        job_id: 8710874
        result: step_1_timeout_before_second_forward
        first_step_seconds: 561.98
        peak_reserved_gib: 63.447
        reason: retaining expert activations exhausts the XPU memory envelope even with factored optimizer state
      do_not_repeat: true
    next_candidate:
      status: implementation_required
      hypothesis: fuse routed-token packing, AllToAll, and expert-major unpack/combine to remove per-layer temporary and launch overhead
      promotion_status: not_a_candidate_until_cpu_equivalence_and_fresh_node_smoke
    incremental_changes:
      status: implemented_cpu_verified_pending_hardware_ab
      candidates:
        - change: vectorized_ag_dispatch_metadata
          files: [torchtune/modules/moe/_parallelism.py, tests/torchtune/dev/rl/test_ep_all2all_dispatch_equivalence.py]
          promotion_status: not_claimed
          cpu_equivalence: passed_reference_comparison_including_zero_and_uneven_counts
          fixed_controls: [routing_index_mode]
          note: Uses device-side integer metadata after the existing token-count exchange; it does not enable device routing metadata or change collective transport.
        - change: reuse_integer_ag_dispatch_metadata
          files: [torchtune/modules/moe/_parallelism.py, tests/torchtune/dev/rl/test_ep_all2all_dispatch_equivalence.py]
          promotion_status: not_claimed
          cpu_equivalence: covered_by_vectorized_metadata_reference_tests
          fixed_controls: [routing_index_mode, metadata_transport]
          note: Reuses the canonical int64 routing-count tensor and performs prefix subtraction in the cumulative buffers in the vectorized AG/RS metadata builder; legacy integer widths still normalize safely without mutating caller metadata.
        - change: inplace_ag_rank_offset_metadata
          files: [torchtune/modules/moe/_parallelism.py, tests/torchtune/dev/rl/test_ep_all2all_dispatch_equivalence.py]
          promotion_status: not_claimed
          cpu_equivalence: covered_by_vectorized_metadata_reference_tests
          fixed_controls: [metadata_transport, routing_index_mode]
          note: Constructs rank token offsets in place before broadcasting them across owned experts, avoiding a temporary multiply result without changing dispatch indices.
        - change: direct_grouped_alltoall_permutations
          files: [torchtune/modules/moe/_parallelism.py, tests/torchtune/dev/rl/test_ep_all2all_dispatch_equivalence.py]
          promotion_status: not_claimed
          cpu_equivalence: passed_distributed_forward_backward_and_metadata_reference_tests_including_zero_and_uneven_counts
          fixed_controls: [routing_index_mode, metadata_transport]
          note: Builds send and expert permutations from grouped count ranges instead of materializing per-token expert IDs and stable-sorting them; collective split lists and token order remain unchanged.
        - change: cpu_vectorized_alltoall_metadata
          files: [torchtune/modules/moe/_parallelism.py, tests/torchtune/dev/rl/test_ep_all2all_dispatch_equivalence.py]
          promotion_status: not_claimed
