# Qwen3-0.6B LoRA-GRPO — per-rank COLOCATE smoke (bring-up for the colocate path)
#
# Smallest model to validate the LoRA-colocate code path end-to-end on hardware
# BEFORE the 4B run: gate lift, per-rank in-process vLLM init, summon+merge+
# load_weights, step 0->1 boundary, reward off baseline. Run on a small world
# (e.g. NTILES<=4) for a few steps.
#
# Recipe:   recipes/dev/lora_grpo_full_finetune_distributed_xpu.py (vllm_mode=colocate)
# Launcher: experiments/lora_grpo/run_lora_colocate.sh
#   MODEL_PATH=/lus/flare/projects/ModCon/ngetty/models/Qwen3-0.6B \
#   CONFIG=recipes/configs/dev/smoke/qwen3_0_6b_lora_grpo_colocate_xpu.yaml \
#   NTILES=4 NSTEPS=3 bash experiments/lora_grpo/run_lora_colocate.sh

name: lora_grpo_qwen3_0_6b_colocate_smoke
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/outputs/lora_grpo_qwen3_0_6b_colocate_smoke
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-0.6B

# ── vLLM (colocate — in-process TP=1 per rank) ───────────────────────────────
vllm_mode: colocate
vllm_tensor_parallel_size: 1
vllm_enforce_eager: true
vllm_gpu_memory_utilization: 0.45     # 0.6B is tiny; don't over-reserve
vllm_max_model_len: 768
vllm_max_num_seqs: 32
reshard_after_forward: true

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  _component_: torchtune.models.qwen3.lora_qwen3_0_6b_base
  lora_attn_modules: ['q_proj', 'k_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: true
  apply_lora_to_output: false          # tied embeddings on 0.6B
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0

# ── Tokenizer ─────────────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: ${max_seq_len}

# ── Checkpointer ──────────────────────────────────────────────────────────────
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [model.safetensors]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN3

# No ref_checkpointer — disable_adapter() context for the ref fwd.

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  _component_: torchtune.dev.rl.gsm8k.gsm8k_dataset
  partition: 1-9/10

seed: 42
shuffle: true
resume_from_checkpoint: false

# ── RL Hyperparameters (smoke envelope) ───────────────────────────────────────
grpo_samples: 4
max_seq_len: 512
max_generated_tokens: 256
temperature: 1.0
top_k: null

# ── Training ──────────────────────────────────────────────────────────────────
epochs: 1
num_steps: 3
ppo_epochs: 1
batch_size: 1                          # per-rank distinct prompts under colocate sampler
forward_batch_size: 4
ref_forward_batch_size: 4
gen_batch_size: 1
gradient_accumulation_steps: 1

optimizer:
  _component_: torch.optim.AdamW
  lr: 3.0e-5
  weight_decay: 0.01
  fused: false

lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 1

clip_grad_norm: 1.0

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  _component_: torchtune.dev.rl.loss.GRPOLoss
  kl_coeff: 1.0e-4
  epsilon: 0.2

# ── Reward (GSM8K math) ───────────────────────────────────────────────────────
reward_functions:
  - _component_: torchtune.dev.rl.rewards.FormattedMathCorrectnessReward
    answer_tag: answer
    positive_reward: 10.0
    negative_reward: 0.0
  - _component_: torchtune.dev.rl.rewards.ThinkingAnswerFormattingReward
    think_tag: think
    answer_tag: answer
    positive_reward: 1.0
    negative_reward: 0.0

# ── LoRA publish config ───────────────────────────────────────────────────────
lora:
  publish_every_steps: 1
  max_loras: 2
  log_validation_metrics: true

# ── Distributed / FSDP ────────────────────────────────────────────────────────
fsdp_shard_strategy: FULL_SHARD
enable_activation_checkpointing: true
save_adapter_weights_only: true

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
compile: false
force_math_sdpa: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_every_n_steps: 1
log_peak_memory_stats: true
save_every_n_epochs: 1

metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
