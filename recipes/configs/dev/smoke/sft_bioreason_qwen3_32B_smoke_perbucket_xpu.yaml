# BioReason Qwen3-32B SFT — 1-node SMOKE for PER-BUCKET BATCH SIZING (throughput lever).
#
# Difference from smoke_bucket: adds `bucket_batch_sizes: [4, 2, 1]` aligned to
# `pad_buckets: [2048, 4096, 6144]`. A length-grouped distributed batch sampler
# (LengthGroupedDistributedBatchSampler) then gives each length bucket its own batch size,
# so short sequences amortize the 65 GiB FSDP weight-gather over 4 samples/sweep while the
# rare long ones stay bs1 — over the FULL corpus (no seq cap, no dropped data). This is the
# production throughput answer the seq-cap sweep (4.8x) could not give without coverage loss.
#
# Memory ceiling check (attn transient at bf16, the thing that forced bs1):
#   2048 x bs4 = 16.8M elems, 4096 x bs2 = 33.6M, 6144 x bs1 = 37.7M  -> all <= the
#   validated 6144-bs1 ceiling. Safe by construction.
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py
# Smoke uses the validation shard (fast load); the production config points at the train dir.

name: sft_bioreason_qwen3_32b_smoke_perbucket
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_file: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data/validation-00000-of-00001.parquet
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model (native-Qwen3 BioReason wrapper; device/dtype injected by the recipe) ─
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: true
  lora_rank: 32
  lora_alpha: 64
  apply_lora_to_mlp: true
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_file}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
  drop_over_length: true
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope ─────────────────────────────────────────────────────────
epochs: 1
max_steps_per_epoch: 12
# batch_size is IGNORED when bucket_batch_sizes is set (the batch sampler owns sizing).
batch_size: 1
gradient_accumulation_steps: 4

# Per-bucket batch sizing (throughput lever) — buckets + per-bucket batch size, aligned.
# Buckets TUNED to the measured corpus dist (validation shard: 40% <=3072, 79% <=4096, p50=3265)
# AND the validated attn-transient ceiling b*S^2 <= 37.7M elems (= the 6.04 GiB fp32 score tensor
# that 6144xbs1 sits at). Max safe bs: 3072->4, 4096->2, 6144->1 (each bucket at its ceiling:
# 3072xbs4 has the SAME 6.04 GiB score transient as the validated 6144xbs1). [2048,...] wastes the
# bs4 tier here (only 2% <=2048); [3072,4096,6144][4,2,1] = 1.98x fewer FSDP gather-sweeps
# (309 vs 613/rank) over the FULL corpus, no dropped data. Re-tune buckets per corpus for prod.
pad_to_fixed: true
# TWO buckets only: [4096, 6144] is the EXACT shape set the prior bucket run (job 8656593) proved
# clean for 12 steps on the default allocator (max_protein_len=2048 on this corpus never yields
# <4096-that-matters; that run saw only 4096+6144). Adding a 3rd shape (3072) widened the VA-churn
# surface and hit banned:1 at step2. bs2 on the 79% <=4096 majority => 1.65x fewer FSDP gather-sweeps
# (372 vs 613/rank), isolating per-bucket BATCH SIZING (bs2 vs bs1) on a known-safe shape set. 4096xbs2
# == 6144xbs1 attn-transient (both 6.04 GiB, at the validated ceiling). Re-add a 3rd bucket only with
# a working allocator fix.
pad_buckets: [4096, 6144]
bucket_batch_sizes: [2, 1]
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full shard (baseline-comparable) ─────────────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
compile: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
