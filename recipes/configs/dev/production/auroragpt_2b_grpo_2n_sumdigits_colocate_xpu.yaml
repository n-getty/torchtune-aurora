# AuroraGPT-2B GRPO — 2N FLAT COLOCATE on sum_digits (2N topology throughput study)
#
# Topology #1 of the "best 2N AGPT-2B setup" study (docs/reports/agpt2b_2n_topology_
# throughput_*.md): all 24 ranks (2 nodes x 12 tiles) BOTH train AND host an in-process
# vLLM (colocate). Compared against #2 dedicated_rank (11 train + 1 vLLM tile/node) and
# #3 dedicated vLLM node (12 train / 12 servers).
#
# THROUGHPUT STUDY — not learning-matched. Each topology runs at its own production-
# tuned envelope; we compare seqs/s + gen/train/wsync breakdown + peak mem. Base
# envelope: sum_digits, G=16, bs=1, max_gen=64, temp=0.7, beta=0 (GRPOSimpleLoss).
# Phase B sweeps G up to this topology's max-safe ceiling.
#
# Generation: each of the 24 ranks generates its own bs(1) x G(16) = 16 sequences
# in-process, fully parallel, no cross-rank generation collective. Weight sync is a
# per-param FSDP2 full_tensor() -> local vLLM load_weights (no cross-node wire).
# Distinct prompts/step = bs x world_size = 24 (each rank draws a distinct slice).
#
# Pair with launcher: experiments/auroragpt_2b_bakeoff/2N_sweep.sh
#   (mpiexec --pmi=pmix, 24 ranks; world-size + FSDP-mesh + metric-reduce fixes landed
#    2026-06-18). Run at fixed G via GRPO_SAMPLES env or sweep in Phase B.

name: grpo_auroragpt_2b_2n_sumdigits_colocate
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/outputs/grpo_agpt2b_2n_sumdigits_colocate
base_model_path: /flare/AuroraGPT/AuroraGPT-v1/Experiments/AuroraGPT-2B/public/sophiag/hf/global_step138650

data_parallel_replicate_dim: 1

# ── vLLM (colocate — resident weights, TP=1 per rank) ────────────────────────
vllm_mode: colocate
vllm_enforce_eager: true
vllm_gpu_memory_utilization: 0.20    # 2B is memory-comfortable on 64 GiB tiles
vllm_max_model_len: 256
vllm_max_num_seqs: 32                 # >= bs*G (1*16)
reshard_after_forward: true

# ── Model ────────────────────────────────────────────────────────────────────
model:
  _component_: torchtune.models.llama3.llama3
  vocab_size: 256000
  num_layers: 12
  num_heads: 16
  num_kv_heads: 4
  embed_dim: 2048
  max_seq_len: 1024
  intermediate_dim: 11008
  rope_base: 50000

# ── Tokenizer ────────────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.dev.rl.ezpz_tasks.auroragpt_tokenizer
  path: ${base_model_path}/tokenizer.model
  max_seq_len: 1024

# ── Checkpointers (policy + ref share the base model) ────────────────────────
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [pytorch_model.bin]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: LLAMA3

ref_checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [pytorch_model.bin]
  recipe_checkpoint: null
  output_dir: ${output_dir}/ref
  model_type: LLAMA3

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset (ezpz sum_digits) ────────────────────────────────────────────────
dataset:
  _component_: torchtune.dev.rl.ezpz_tasks.build_ezpz_dataset
  task: sum_digits
  num_samples: 0
  seed: 42
  max_seq_len: 512
seed: 42
shuffle: true

# ── GRPO hparams (throughput-study base envelope; G swept in Phase B) ─────────
batch_size: 1
grpo_samples: 16
forward_batch_size: 8
ref_forward_batch_size: 8
max_generated_tokens: 64
top_k: null
temperature: 0.7
gen_batch_size: 1

epochs: 1
num_steps: 50
ppo_epochs: 1
gradient_accumulation_steps: 1
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.01
  fused: false

lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 2

loss:
  _component_: torchtune.dev.rl.loss.GRPOSimpleLoss
  kl_coeff: 0.0
  epsilon: 0.2

reward_functions:
  - _component_: torchtune.dev.rl.ezpz_tasks.SumDigitsReward

# ── Distributed / XPU ────────────────────────────────────────────────────────
enable_activation_checkpointing: true
device: xpu
dtype: bf16
compile: false

# ── Logging ──────────────────────────────────────────────────────────────────
log_every_n_steps: 1
log_peak_memory_stats: true

metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
