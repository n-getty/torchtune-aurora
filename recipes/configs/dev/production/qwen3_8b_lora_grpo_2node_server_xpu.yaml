# Qwen3-8B LoRA-GRPO — 2-node server mode
#
# Topology (identical to 4B config):
#   Node 0 (TRAIN_NODE): 11 training ranks, FSDP1 SHARD_GRAD_OP.
#   Node 1 (VLLM_NODE): 12 vLLM HTTP servers (DP=12, ports 8001-8012, TP=1 each).
#     Loads Qwen3-8B base weights + LoRA adapter via /v1/load_lora_adapter.
#
# Weight sync: tmpfs hot-swap (no Lustre for publish path):
#   rank 0 gathers adapter SD → writes /dev/shm/lora_adapters/slot_N/ →
#   rsync to VLLM_NODE /dev/shm/lora_adapters/slot_N/ →
#   POST /v1/load_lora_adapter (async background thread, overlaps with gen).
#
# Recipe: recipes/dev/lora_grpo_full_finetune_distributed_xpu.py
# Launcher: experiments/lora_grpo/run_qwen3_4b_lora_2node.sh (pass MODEL_PATH override)

name: lora_grpo_qwen3_8b_2node_server
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/outputs/lora_grpo_qwen3_8b_2node_v1

# ── Model ─────────────────────────────────────────────────────────────────────
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-8B

model:
  _component_: torchtune.models.qwen3.lora_qwen3_8b_base
  lora_attn_modules: ['q_proj', 'k_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: true
  apply_lora_to_output: false          # no tied embeddings on 8B
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0

# ── Tokenizer ─────────────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: ${max_seq_len}

# ── Checkpointer ──────────────────────────────────────────────────────────────
checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00005.safetensors,
    model-00002-of-00005.safetensors,
    model-00003-of-00005.safetensors,
    model-00004-of-00005.safetensors,
    model-00005-of-00005.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN3

# No ref_checkpointer — LoRA recipe uses disable_adapter() context instead.

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset:
  _component_: torchtune.dev.rl.gsm8k.gsm8k_dataset
  partition: 1-9/10

seed: 42
shuffle: true
resume_from_checkpoint: false

# ── RL Hyperparameters ────────────────────────────────────────────────────────
grpo_samples: 8                        # conservative G for first 8B run (paper G=24)
max_seq_len: 1024
max_generated_tokens: 512
temperature: 1.0
top_k: null

# ── Training ──────────────────────────────────────────────────────────────────
epochs: 1
num_steps: 50
ppo_epochs: 1
batch_size: 4                          # ppo_batch_size = batch_size * grpo_samples = 32
forward_batch_size: 1                  # fbs=1 with AC=false (no recomputation kernel explosion)
gradient_accumulation_steps: 1

optimizer:
  _component_: torch.optim.AdamW
  lr: 3.0e-5
  weight_decay: 0.01
  fused: false

lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 5

clip_grad_norm: 1.0

# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  _component_: torchtune.dev.rl.loss.GRPOLoss
  kl_coeff: 1.0e-4
  epsilon: 0.2

# ── Reward ────────────────────────────────────────────────────────────────────
reward_functions:
  - _component_: torchtune.dev.rl.rewards.FormattedMathCorrectnessReward
    answer_tag: answer
    positive_reward: 10.0
    negative_reward: 0.0
  - _component_: torchtune.dev.rl.rewards.ThinkingAnswerFormattingReward
    think_tag: think
    answer_tag: answer
    positive_reward: 1.0
    negative_reward: 0.0

# ── LoRA publish config ────────────────────────────────────────────────────────
# Default = runtime hot-swap (memory project_lora_grpo_torch211_unblocks_bgmv.md);
# requires the torch 2.11+xpu venv on the vLLM node and --enable-lora at startup.
lora:
  use_runtime_lora: true
  publish_every_steps: 1
  max_loras: 2
  shm_root: /lus/flare/projects/ModCon/ngetty/torchtune/outputs/lora_grpo_qwen3_8b_2node_v1/adapters  # save_checkpoint only
  tmpfs_transfer: true                 # write to /dev/shm, rsync to VLLM_NODE (no Lustre)
  train_shm: /dev/shm/lora_adapters
  vllm_shm: /dev/shm/lora_adapters

# ── vLLM rollout (server mode, DP=12) ─────────────────────────────────────────
vllm_mode: server
vllm_weight_sync: false
vllm_max_model_len: 1536
vllm_max_num_seqs: 32                  # reduced from 64 (8B uses more KV cache memory)

vllm:
  mode: server
  enable_lora: true
  max_lora_rank: 16
  max_loras: 2

# ── Distributed / FSDP ────────────────────────────────────────────────────────
fsdp_shard_strategy: SHARD_GRAD_OP
enable_activation_checkpointing: false
save_adapter_weights_only: true

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
compile: false
force_math_sdpa: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_every_n_steps: 1
log_peak_memory_stats: true
save_every_n_epochs: 1

metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
