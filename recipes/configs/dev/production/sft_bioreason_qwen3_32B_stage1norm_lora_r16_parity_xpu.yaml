# BioReason multimodal SFT — Aurora↔rbdgx3 PARITY leg A2: LoRA r16/a32 on Aurora's
# validated l37+LayerNorm stack.
#
# See experiments/bioreason/parity/PARITY_CONTRACT.md. This config isolates the
# LoRA-vs-frozen recipe axis, machine-free: everything except enable_lora/lora_rank/
# lora_alpha/lora_dropout is held at Aurora's stage1norm values (l37 ESM3 cache,
# LayerNorm projector output, stage1_proj_dir step-10 projector) — the SAME values as
# Leg A1 (sft_bioreason_qwen3_32B_stage1norm_xpu.yaml). rbdgx3's own recipe is
# LoRA r16/alpha32/dropout0.05, so this config ports exactly that adapter shape onto
# Aurora's backbone/projector stack.
#
# ⚠️ COLLAPSE GATE (mandatory, see the plan): LoRA on the backbone is the documented
# cause of the ':' splice collapse
# (memory/project_bioreason_sft_lora_splice_collapse_20260630.md) that Aurora abandoned
# LoRA to escape. Train this config with SAVE_EVERY=10, then at step ~10-20 run
# experiments/bioreason/probe_generation_health.py against the checkpoint. If
# generation collapses to ':', STOP — "LoRA collapses on Aurora's l37+LayerNorm stack"
# is itself the parity finding for Leg A2, not a launcher failure.
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py

name: sft_bioreason_qwen3_32b_stage1norm_lora_r16_parity_xpu
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_dir: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048_l37.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# Same Stage-1-aligned projector as Leg A1 (step-10, norm ~721, near text scale).
stage1_proj_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/stage1_aligned_projector_step10

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model — LoRA r16/a32/dropout0.05 on Aurora's l37+LayerNorm stack ────────────
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: true          # rbdgx3-recipe leg: LoRA-finetune the backbone
  freeze_backbone: false     # (ignored under LoRA; base frozen except adapters)
  freeze_projector: true     # LOCK the Stage-1-aligned projector, same as Leg A1.
  projector_output_norm: true # stage1_aligned_projector_step10 includes LayerNorm.
  lora_rank: 16               # rbdgx3 recipe (Aurora's own stage2 config uses 32)
  lora_alpha: 32               # rbdgx3 recipe (Aurora's own stage2 config uses 64)
  lora_dropout: 0.05            # rbdgx3 recipe (Aurora's own stage2 config uses 0)
  apply_lora_to_mlp: true
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset (identical distribution to Stage 1 + eval) ──────────────────────────
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_dir}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope — conservative lr, mirrors Aurora's stage2 config ────────
epochs: 1
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 2.0e-5
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full 12-way shard ──────────────────────────────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1
pad_to_fixed: true

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
compile: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
