# BioReason multimodal SFT — STAGE 1 (projector alignment) at ESM3 LAYER -1 (final layer,
# unbounded ~10600-norm features), native Qwen3-32B (Aurora / XPU).
#
# ★★ WHY THIS CONFIG EXISTS: parity leg A2v2 (LoRA r16/a32 on rbdgx3's real recipe — layer -1
# + no projector LayerNorm) collapsed 5/5 on Aurora's ONLY existing layer-1 checkpoint
# (epoch_0_layer-1_baseline). That checkpoint is a 10-step negative control (job 8574183,
# see memory/project_bioreason_32b_sft_validated_eval_gap_20260628.md) that Aurora's own
# history already proved eval-collapses 100% with NO LoRA at all — the LoRA result on top
# of it is uninformative. rbdgx3's actual working layer-(-1) Stage-1 checkpoint
# (stage1_gopred_fullscale/step_2089) trained to real convergence (loss ~1.14 -> ~0.6-0.8,
# stabilizing by ~step 50-100, held through step 2089). THIS config re-runs Stage-1
# alignment on Aurora at layer -1 to a comparable depth, so Leg A2v3 (LoRA on top of it) is
# a fair test of the layer-1/no-LayerNorm pairing instead of a test of an undertrained base.
#
# Identical to sft_bioreason_qwen3_32B_stage1_xpu.yaml (the layer-37 Stage-1 config) except:
# esm3_cache_path points at the UNSUFFIXED (layer -1) cache instead of _l37, and the output
# dir is separate so it never collides with the layer-37 lineage.
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py

name: sft_bioreason_qwen3_32b_stage1_layerneg1_xpu
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_dir: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data
# LAYER -1 (final layer, unbounded ~10600-norm features) — matches rbdgx3's real recipe.
# NOT the scale-fixed l37 cache used by every other Aurora Stage-1 config.
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model — STAGE 1: frozen backbone, no LoRA, train projections only ──────────
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: false          # Stage 1: NO LoRA — backbone fully frozen
  freeze_backbone: true       # train ONLY protein_projection + go_projection
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2   # Qwen3 uses the QWEN2 weight-conversion path

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset (identical distribution to Stage 2 + eval) ──────────────────────────
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_dir}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
  # Parity fix (2026-08-13): rbdgx3 trains with add_uniprot_summary=True; Aurora's
  # dataset_sft.py had no such field until this session, causing a systematic loss-scale
  # gap (~1.0 vs ~0.7 at the same step) that looked like a possible alignment problem
  # before being root-caused to this missing prompt/target field. See
  # experiments/bioreason/parity/PARITY_CONTRACT.md confound #5.
  add_uniprot_summary: true
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope — Stage 1: 1 epoch, lr 1e-4 (published Stage 1) ────────────
epochs: 1
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full 12-way shard (HW-VALIDATED 2026-06-27) ─────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true    # MUST stay true for 32B: ZeRO-2 (=false) keeps params resident
                                     # post-fwd -> 53+ GiB alloc -> OOM on a 64 GiB tile (job 8672602,
                                     # 2N). reshard=true runs at ~21 GiB reserved (soak 8671166). ZeRO-2
                                     # is ALSO a null on the 2N step tax (job 8671990: T=145 vs F=144) —
                                     # the 2N slowdown is the FORWARD all-gather, not the backward re-gather.
                                     # (ZeRO-2 works for AGPT-2B 2B but NOT for 32B — model-size dependent.)
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1
pad_to_fixed: true

# ── Throughput: bucketed per-bucket batch sizing (HW-VALIDATED 2026-07-15, jobs 8674109/8674383) ──
# The 65% GEMM floor is attacked by filling the fixed shape with real tokens instead of ~43% pad.
# Length-grouped batch sampler: 79% of the corpus (<=4096) trains at seq4096 in bs2 microbatches;
# the >4096 tail stays seq6144 bs1. This is PLAIN CAUSAL per row (mask=None) -> the shipped FLASH
# kernel handles it natively (NO flex — token PACKING via block-diag flex was HW-REFUTED, flex bwd
# 5-10x too slow, see project_bioreason_sft_packing_scope_20260715). 2-shape set is banned:1-safe
# (>=3 distinct [bs,seq] churn XPU allocator VAs). 4096xbs2 attn transient == 6144xbs1 (memory-safe).
# bs2/seq4096 amortizes the FSDP weight-gather ~16.6%/sample on flash (vs 4.5% on pre-flash math —
# flash's cheap attention is what makes batching pay). Weighted throughput ~1.49x vs pad_to_fixed bs1;
# ~1.60x stacked with compile below. batch_size is IGNORED when bucket_batch_sizes is set (sampler
# owns sizing); gradient_accumulation_steps still applies. See LengthGroupedDistributedBatchSampler.
pad_buckets: [4096, 6144]
bucket_batch_sizes: [2, 1]

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
# Per-layer backbone torch.compile (dynamic). HW-VALIDATED +5.8% seq6144 stacked on flash+bucketbs
# (soak job 8674383: 15 steps clean, NO recompile churn across the finite 2-shape bucket set — dynamic
# caches 2 graphs and reuses them — NO banned:1, loss monotonic, ~6.8%/sample on top of bucketbs).
# One-time ~420s compile in step 1 (step1 188.75s -> steady 78.4s/it), amortizes in ~80 steps.
# The BioReason subclass reimplements _setup_model, so this is read via _compile_model -> compile_model
# (targets only TransformerSelfAttentionLayer; the multimodal splice stays eager). loss:false avoids the
# LinearCrossEntropyLoss compile edge. Requires TORCHTUNE_USE_XPU_FLASH=1 (launcher default).
compile:
  model: true
  loss: false
  optimizer_step: false
  scale_grads: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
