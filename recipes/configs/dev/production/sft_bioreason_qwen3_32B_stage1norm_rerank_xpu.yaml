# BioReason multimodal SFT — stage1norm + PER-CANDIDATE RERANK TARGET, native Qwen3-32B (XPU)
#
# ★ Per-candidate GO term reranking (2026-08-05). Identical to stage1norm (frozen backbone,
# no LoRA, LayerNorm projector, layer-37 ESM3, full acceleration stack) EXCEPT the SFT target
# appends a VERBALIZED SCORE per candidate GO term ("GO:0005515 0.92") instead of a bare term
# list (dataset.rerank_target=true), so the CAFA eval's own tau sweep — which already takes an
# argmax over confidence thresholds per namespace — has a real per-term signal to rank against.
#
# WHY (see docs — the BioReason per-candidate reranking plan, and
# memory/project_bioreason_32b_vs_4b_parity_is_gopred_ceiling_20260805.md): our 32B ties the
# paper's 4B (0.6885 vs 0.6887) not because of a capacity gap but because BOTH models are
# bounded by the go_pred hint under a "name ~7 terms" output interface — echoing go_pred
# verbatim (0.7083) already beats both trained models, and an ORACLE filter over go_pred
# reaches 0.8229. Simulated rerankers over the real candidate lists (scored through the real
# cafa_eval at th_step=0.05) show F_max >= today's number BY CONSTRUCTION (the tau sweep
# includes the keep-everything operating point), with even weak calibration (skill=0.3)
# reaching ~0.7335 (~= published SOTA) and moderate calibration (skill=0.6) reaching the
# 0.8229 oracle bound. Risk is bounded: a worthless learned signal still matches the echo
# floor; the downside is miscalibration wasting headroom, not losing ground.
#
# Binary-label risk (mitigated): the dataset has no confidence column, so naive targets would
# be literal 0.00/1.00 (re-collapsing the sweep to a single threshold, same failure mode as the
# paper's own hardcoded-1.0 predictions). Scores are instead drawn from a FROZEN per-term
# empirical prior — P(correct | term in go_pred) — computed over TRAIN shards ONLY via
# scripts/build_gopred_prior.py (see gopred_prior_path below), giving varied per-term targets.
#
# Truncation risk (mitigated): the base dataset's _filter_over_length only checks the PROMPT;
# a long target silently right-truncates and _build_target_ids appends EOS LAST, so naive
# truncation drops EOS first. rerank_target caps candidates by REMAINING ROOM (never a fixed
# count), adds whole scored lines only if they fit, and always reserves the final slot for
# EOS — see torchtune/dev/bioreason/dataset_sft.py::_build_rerank_target_ids.
#
# GATE: probe the first checkpoint (~step 10-20) with probe_collapse.py / a manual generation
# check BEFORE letting this run long — same discipline as any frozen-backbone target-format
# change. Compare F_max against BOTH the stage1norm baseline AND the echo floor (0.7083) —
# beating the baseline while losing to echo is not progress.
#
# Differences from sft_bioreason_qwen3_32B_stage1norm_xpu.yaml: dataset.rerank_target=true +
# dataset.rerank_prior_path, separate name/output_dir. Everything else identical (frozen,
# LayerNorm, layer-37, lr 1e-4, full accel stack: flash/compile/bucketbs).
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py

name: sft_bioreason_qwen3_32b_stage1norm_rerank_xpu
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_dir: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data
# Frozen per-term prior (P(correct | term in go_pred)), built by
# scripts/build_gopred_prior.py over train-*.parquet ONLY (validated zero overlap with
# the validation split and the bioreason_pro_test held-out eval set).
gopred_prior_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/gopred_prior.json
# LAYER-37 ESM3 cache (the scale fix). The final-layer (-1) cache has per-row norm ~10600,
# which the projector cannot bridge before the go_pred text leak kills the loss gradient ->
# ':' collapse (HW-confirmed: 10-step Stage-1 left norm ~7768, still ':'). Published recipe
# uses layer 37. Built by precompute_esm3_layer37.sh.
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048_l37.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model — STAGE 1: frozen backbone, no LoRA, train projections only ──────────
# protein/go ids are RESERVED Qwen vocab gap ids (151643/151644; gap 151643-151935 is free).
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: false              # NO LoRA — backbone fully frozen (sidesteps LoRA splice bug)
  freeze_backbone: true           # train ONLY protein_projection + go_projection
  projector_output_norm: true     # LayerNorm on projector output -> BOUNDED magnitude (no
                                  # over-amplify; per-row norm ~sqrt(H)~71). The whole point.
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2   # Qwen3 uses the QWEN2 weight-conversion path

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset — RERANK-TARGET: verbalized per-candidate scores for breadth + ranking ───
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_dir}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
  rerank_target: true                       # ★ per-candidate verbalized scores
  rerank_prior_path: ${gopred_prior_path}
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope — Stage 1: 1 epoch, lr 1e-4 (published Stage 1) ────────────
epochs: 1
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full 12-way shard (HW-VALIDATED 2026-06-27) ─────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true    # MUST stay true for 32B: ZeRO-2 (=false) keeps params resident
                                     # post-fwd -> 53+ GiB alloc -> OOM on a 64 GiB tile (job 8672602,
                                     # 2N). reshard=true runs at ~21 GiB reserved (soak 8671166). ZeRO-2
                                     # is ALSO a null on the 2N step tax (job 8671990: T=145 vs F=144) —
                                     # the 2N slowdown is the FORWARD all-gather, not the backward re-gather.
                                     # (ZeRO-2 works for AGPT-2B 2B but NOT for 32B — model-size dependent.)
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1
pad_to_fixed: true

# ── Throughput: bucketed per-bucket batch sizing (HW-VALIDATED 2026-07-15, jobs 8674109/8674383) ──
# NOTE: the scored candidate list makes the target LONGER on average than the curated-only
# trace (~15 tok/scored-term measured) — this shifts some examples across the 4096/6144
# bucket boundary vs the stage1norm baseline, same effect the gopredtarget config already
# flagged, but the bucket infra itself is unaffected (still 2 shapes).
pad_buckets: [4096, 6144]
bucket_batch_sizes: [2, 1]

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
# Per-layer backbone torch.compile (dynamic). HW-VALIDATED +5.8% seq6144 stacked on flash+bucketbs.
compile:
  model: true
  loss: false
  optimizer_step: false
  scale_grads: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
