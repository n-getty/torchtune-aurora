# Qwen3-4B DENSE GRPO — 1-NODE COLOCATE (dp_replicate=1) for the cross-machine
# GRPO benchmarking campaign's Aurora native-leg cell.
#
# Derived from qwen3_4b_grpo_colocate_sumdigits_xpu.yaml (2N HSDP) by dropping
# to a single node (dp_replicate=1, 12-way intra-node shard only) so it fits
# the campaign's single-node hold. Same model/dataset/loss, single-node topology.
#
# Recipe:   recipes/dev/grpo_full_finetune_distributed_xpu.py
# Launcher: experiments/grpo_cross_machine_bench/run_aurora_grpo_cell.sh

name: grpo_qwen3_4b_1n_colocate
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/outputs/grpo_qwen3_4b_1n_colocate
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-4B

data_parallel_replicate_dim: 1

vllm_mode: colocate
vllm_enforce_eager: true
vllm_gpu_memory_utilization: 0.30
vllm_max_model_len: 256
vllm_max_num_seqs: 32
reshard_after_forward: true

model:
  _component_: torchtune.models.qwen3.qwen3_4b_base

tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 1024

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00003.safetensors,
    model-00002-of-00003.safetensors,
    model-00003-of-00003.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN3

ref_checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00003.safetensors,
    model-00002-of-00003.safetensors,
    model-00003-of-00003.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}/ref
  model_type: QWEN3

resume_from_checkpoint: false
save_every_n_epochs: 1

dataset:
  _component_: torchtune.dev.rl.ezpz_tasks.build_ezpz_dataset
  task: sum_digits
  num_samples: 0
  seed: 42
  max_seq_len: 512
seed: 42
shuffle: true

batch_size: 1
grpo_samples: 16
forward_batch_size: 8
ref_forward_batch_size: 8
max_generated_tokens: 64
top_k: null
temperature: 0.7
gen_batch_size: 1

epochs: 1
num_steps: 10
ppo_epochs: 1
gradient_accumulation_steps: 1
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.01
  fused: false

lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 2

loss:
  _component_: torchtune.dev.rl.loss.GRPOSimpleLoss
  kl_coeff: 0.0
  epsilon: 0.2

reward_functions:
  - _component_: torchtune.dev.rl.ezpz_tasks.SumDigitsReward

enable_activation_checkpointing: true
device: xpu
dtype: bf16
compile: false

log_every_n_steps: 1
log_peak_memory_stats: true

metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
