# BioReason multimodal SFT — stage1norm + BINARY KEEP-LIST TARGET, native Qwen3-32B (XPU)
#
# ★ Binary keep-list target (2026-08-09). Identical to stage1norm (frozen backbone, no LoRA,
# LayerNorm projector, layer-37 ESM3, full acceleration stack) EXCEPT the SFT target prepends
# a CANDIDATES-FIRST list of bare "GO:XXXXXXX" lines — ONLY the in-prompt go_pred candidates
# that are ALSO in this example's ground truth (dataset.keep_list_target=true). Dropped
# (non-GT) candidates are simply absent; there are no score digits and no explicit
# negative-class lines. Non-GT candidates that are dropped are never labeled 0 anywhere in
# the target — this is a pure per-candidate FILTERING signal, not a rerank score.
#
# WHY (see ~/.claude/plans/create-a-plan-with-twinkly-robin.md and
# docs/reports/bioreason_gopred_sft_rerank_target_status_20260809.md): a zero-training offline
# probe over the exact 150-protein held-out sample shows the scored rerank_target format's
# distinguishing feature (the verbalized confidence digit) is worth only +0.0008 F_max over a
# flat 1.0 score — CAFA's tau sweep barely reorders anything per protein from a
# protein-INDEPENDENT term-keyed score. The `filtered` variant (only candidates in GT, bare,
# no score) reproduces the ORACLE ceiling exactly (0.8297 unweighted / 0.8174 weighted on that
# sample) — i.e. the entire measured lever is WHICH candidates survive, not how they're
# scored. This config trains exactly that binary keep/drop decision.
#
# Candidates-first is NOT optional here (unlike rerank_target's rerank_candidates_first flag):
# the rerank_rank_only ablation (bare IDs, trace-first) showed a severe early-stopping failure
# — 60-93% of generations at some checkpoints never reached the list because dropping the
# score-digit token mass removed what was functioning as an anti-early-stopping signal after
# the trace boundary. Putting the list FIRST removes that failure mode by construction: a tight
# token budget truncates the (lower-priority) trace, never the list.
#
# GATE (mandatory, same discipline as every prior target-format change): before trusting F_max
# on a real checkpoint, (1) run the CPU tests in
# tests/torchtune/dev/bioreason/test_rerank_target.py (keep_list_target section), (2) run the
# offline format probe (render targets for real val rows, score through
# experiments/bioreason/score_fmax_scored.py, confirm a perfect-classifier run reproduces
# ~0.8297/0.8174), (3) probe_generation_health.py on the first checkpoint to confirm the model
# actually emits the list before the trace and reaches EOS, (4) log per-candidate
# keep-decision precision/recall/accuracy at every checkpoint, not just F_max — the offline
# probe shows ~60% per-candidate accuracy is needed just to TIE the (corrected) echo baseline,
# ~80% to clearly beat it.
#
# Differences from sft_bioreason_qwen3_32B_stage1norm_rerank_xpu.yaml: dataset.keep_list_target
# =true instead of dataset.rerank_target=true (no rerank_prior_path required — set it anyway
# below so surviving candidates are ordered by descending prior confidence, matching
# rerank_target's ordering, rather than go_pred's raw first-seen order), separate name/
# output_dir. Everything else identical (frozen, LayerNorm, layer-37, lr 1e-4, full accel
# stack: flash/compile/bucketbs).
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py

name: sft_bioreason_qwen3_32b_stage1norm_keeplist_xpu
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_dir: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data
# Frozen per-term prior (P(correct | term in go_pred)), built by
# scripts/build_gopred_prior.py over train-*.parquet ONLY (validated zero overlap with
# the validation split and the bioreason_pro_test held-out eval set). Optional for
# keep_list_target (only affects ORDER of surviving candidates, not selection) but set here
# so ordering matches rerank_target for a fair comparison.
gopred_prior_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/gopred_prior.json
# LAYER-37 ESM3 cache (the scale fix). The final-layer (-1) cache has per-row norm ~10600,
# which the projector cannot bridge before the go_pred text leak kills the loss gradient ->
# ':' collapse (HW-confirmed: 10-step Stage-1 left norm ~7768, still ':'). Published recipe
# uses layer 37. Built by precompute_esm3_layer37.sh.
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048_l37.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model — STAGE 1: frozen backbone, no LoRA, train projections only ──────────
# protein/go ids are RESERVED Qwen vocab gap ids (151643/151644; gap 151643-151935 is free).
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: false              # NO LoRA — backbone fully frozen (sidesteps LoRA splice bug)
  freeze_backbone: true           # train ONLY protein_projection + go_projection
  projector_output_norm: true     # LayerNorm on projector output -> BOUNDED magnitude (no
                                  # over-amplify; per-row norm ~sqrt(H)~71). The whole point.
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2   # Qwen3 uses the QWEN2 weight-conversion path

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset — KEEP-LIST TARGET: candidates-first, bare in-GT-only lines ─────────
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_dir}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
  keep_list_target: true                    # ★ binary keep-list, candidates-first
  rerank_prior_path: ${gopred_prior_path}    # optional: orders surviving candidates only
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope — Stage 1: 1 epoch, lr 1e-4 (published Stage 1) ────────────
epochs: 1
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full 12-way shard (HW-VALIDATED 2026-06-27) ─────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true    # MUST stay true for 32B: ZeRO-2 (=false) keeps params resident
                                     # post-fwd -> 53+ GiB alloc -> OOM on a 64 GiB tile (job 8672602,
                                     # 2N). reshard=true runs at ~21 GiB reserved (soak 8671166). ZeRO-2
                                     # is ALSO a null on the 2N step tax (job 8671990: T=145 vs F=144) —
                                     # the 2N slowdown is the FORWARD all-gather, not the backward re-gather.
                                     # (ZeRO-2 works for AGPT-2B 2B but NOT for 32B — model-size dependent.)
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1
pad_to_fixed: true

# ── Throughput: bucketed per-bucket batch sizing (HW-VALIDATED 2026-07-15, jobs 8674109/8674383) ──
# NOTE: the keep-list target is SHORTER on average than the curated-only trace for most
# examples (only ~42.5% of candidates survive the GT filter, ~53 candidates/protein base
# rate), the opposite direction from rerank_target's length increase — re-check the bucket
# boundary distribution if throughput looks off relative to the stage1norm baseline.
pad_buckets: [4096, 6144]
bucket_batch_sizes: [2, 1]

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
# Per-layer backbone torch.compile (dynamic). HW-VALIDATED +5.8% seq6144 stacked on flash+bucketbs.
compile:
  model: true
  loss: false
  optimizer_step: false
  scale_grads: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
