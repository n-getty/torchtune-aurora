# BioReason multimodal SFT — Aurora↔rbdgx3 PARITY leg A2v2: LoRA r16/a32/dropout0.05 on
# rbdgx3's ACTUAL recipe (layer -1 ESM3 features, UNBOUNDED projector — NOT LayerNorm).
#
# ★★ WHY THIS CONFIG EXISTS (supersedes sft_bioreason_qwen3_32B_stage1norm_lora_r16_parity_xpu.yaml):
# The first LoRA parity attempt (Leg A2v1) paired LoRA with Aurora's l37+LayerNorm stack —
# the stack validated for a FROZEN backbone (feedback_bioreason_esm3_layer37_scale_fix.md).
# It collapsed on 2/5 probed proteins. Investigation of rbdgx3's actual training script
# (sft_32b_stage2_lora_train.py) showed this was the WRONG pairing: rbdgx3's own working
# LoRA recipe (the one that produced the ~0.65w step2000 checkpoint) uses
# projector_output_norm=False on the LAYER -1 (final-layer, unbounded ~10600-norm) ESM3
# cache — auto-detected from stage1_gopred_fullscale/step_2089's protein_projection.pt,
# which has NO index-3 LayerNorm keys. rbdgx3's script docstring explicitly states the
# LayerNorm fix is "a NET NEGATIVE for Stage-1-alone generation quality on H200" and that
# pairing LoRA with it is exactly the risk profile Aurora's own collapse history warns
# about. So Leg A2v1's collapse was NOT a new Aurora-specific finding — it reproduced a
# known-bad pairing. THIS config ports rbdgx3's real (working) pairing instead.
#
# Stage-1 projector: experiments/bioreason/runs/sft_qwen3_32b_stage1/epoch_0_layer-1_baseline
# (Jun 28 2026 training run, esm3_cache_path=esm3_cache_2048.safetensors i.e. layer -1,
# confirmed via segment_20260628_195131.log; protein_projection.pt keys are 0.*/2.* only,
# i.e. a plain 2-layer MLP, NO LayerNorm — matches rbdgx3's projector_output_norm=False).
#
# ⚠️ COLLAPSE GATE (still mandatory): train SAVE_EVERY=10, then run
# experiments/bioreason/probe_generation_health.py against the checkpoint (with
# --projector_output_norm explicitly False / relying on auto-detect) BEFORE any eval.
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py

name: sft_bioreason_qwen3_32b_lora_r16_parity_v2_layerneg1_xpu
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_dir: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# Layer -1, UNBOUNDED (no LayerNorm) Stage-1 projector — matches rbdgx3's real recipe.
stage1_proj_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/sft_qwen3_32b_stage1/epoch_0_layer-1_baseline

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model — LoRA r16/a32/dropout0.05, layer -1, NO projector LayerNorm ──────────
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: true          # rbdgx3-recipe leg: LoRA-finetune the backbone
  freeze_backbone: false     # (ignored under LoRA; base frozen except adapters)
  freeze_projector: true     # LOCK the Stage-1-aligned (unbounded) projector.
  projector_output_norm: false  # rbdgx3's real recipe: NO LayerNorm (auto-detected False
                                 # from stage1_gopred_fullscale's checkpoint).
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  apply_lora_to_mlp: true
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2

resume_from_checkpoint: false
save_every_n_epochs: 1

# ── Dataset (identical distribution to Stage 1 + eval) ──────────────────────────
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_dir}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope — conservative lr, mirrors Aurora's stage2 config ────────
epochs: 1
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 2.0e-5
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full 12-way shard ──────────────────────────────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1
pad_to_fixed: true

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
compile: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
