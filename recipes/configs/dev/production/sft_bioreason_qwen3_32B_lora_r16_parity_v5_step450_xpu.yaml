# BioReason multimodal SFT — Aurora Stage 2, v5: LoRA r16/a32/dropout0.05 on rbdgx3's real
# recipe (layer -1, UNBOUNDED projector), built on the MOST-CONVERGED Stage-1 checkpoint yet
# (step 450 of sft_qwen3_32b_stage1_layerneg1_full_v2, job 8758738, 2026-08-16).
#
# ★★ WHY: v4 (step-40 Stage-1 snapshot) passed the collapse gate (5/5 clean, no ':'/loop
# collapse) and tied the frozen-backbone Leg A1 on F_max (0.6076u/0.5489w vs 0.6144u/0.5486w)
# — but that comparison was built on a barely-trained Stage-1 base. Meanwhile, continuing
# Stage-1 alone past step 200 has NOT improved F_max (step 200: 0.6371u/0.5782w -> step ~300:
# 0.6155u/0.5571w) and shows a GROWING repetition-loop rate under greedy eval decoding as
# training progresses (3/150 -> 8/150; see
# memory/project_bioreason_bothfixes_stopped_rerank_sft_launched_20260806.md and the
# 2026-08-16 investigation in this session). Per the paper's own two-stage methodology
# (BioReason-Pro/scripts/sh_train_protein_qwen_staged.sh), frozen-backbone Stage 1 was never
# meant to be the final generation-quality checkpoint -- Stage 2 (backbone adaptation) is
# where the model learns to actually reason/terminate cleanly from the aligned features, not
# just match a curated trace's token distribution. This config moves off Stage-1-forever and
# onto Stage 2, built on the deepest Stage-1 base trained so far (step 450, loss plateaued
# ~0.89-0.94 across steps 400-455) instead of the step-40 base used for v4.
#
# stage1_proj_dir is a STABLE SNAPSHOT (not the live, still-training output_dir) taken via
# rsync on 2026-08-16 -- reading a live dir mid-write races exactly like the v2 collapse-gate
# incident (RuntimeError: unable to open file).
#
# ⚠️ COLLAPSE GATE (still mandatory): train SAVE_EVERY=10, then run
# experiments/bioreason/probe_generation_health.py against the checkpoint BEFORE any eval.
# The known collapse failure mode (LoRA + unbounded projector + fast-saturating lr) has
# reappeared before on this recipe family -- do not skip the gate because v4 passed once.
#
# Recipe: recipes/dev/sft_bioreason_distributed_xpu.py

name: sft_bioreason_qwen3_32b_lora_r16_parity_v5_step450_xpu
output_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/${name}
base_model_path: /lus/flare/projects/ModCon/ngetty/models/Qwen3-32B
sft_data_dir: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/data
esm3_cache_path: /lus/flare/projects/ModCon/ngetty/datasets/bioreason_sft_reasoning/esm3_cache_2048.safetensors
go_embedding_path: /lus/flare/projects/ModCon/ngetty/models/bioreason-pro-sft/go_embedding.pt

# Step-450 snapshot of sft_qwen3_32b_stage1_layerneg1_full_v2 (job 8758738, 16N capacity
# segment ending 2026-08-16 01:34 UTC). Loss plateaued ~0.89-0.94 across steps 400-455 --
# the deepest, most-converged layer-1/unbounded-projector Stage-1 base trained on Aurora yet.
stage1_proj_dir: /lus/flare/projects/ModCon/ngetty/torchtune/experiments/bioreason/runs/sft_qwen3_32b_stage1_layerneg1_step450_snapshot

# ── Tokenizer (Qwen3) ─────────────────────────────────────────────────────────
tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: ${base_model_path}/vocab.json
  merges_file: ${base_model_path}/merges.txt
  max_seq_len: 6144

# ── Model — LoRA r16/a32/dropout0.05, layer -1, NO projector LayerNorm ──────────
model:
  _component_: torchtune.dev.bioreason.model_native.BioReasonNativeModel
  backbone_builder: qwen3_32b
  hidden_size: 5120
  protein_token_id: 151643
  go_token_id: 151644
  enable_lora: true          # Stage 2: LoRA-finetune the backbone
  freeze_backbone: false     # (ignored under LoRA; base frozen except adapters)
  freeze_projector: true     # LOCK the Stage-1-aligned (unbounded) projector.
  projector_output_norm: false  # rbdgx3's real recipe: NO LayerNorm.
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  apply_lora_to_mlp: true
  esm3_cache_path: ${esm3_cache_path}
  go_embedding_path: ${go_embedding_path}

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: ${base_model_path}
  checkpoint_files: [
    model-00001-of-00017.safetensors, model-00002-of-00017.safetensors,
    model-00003-of-00017.safetensors, model-00004-of-00017.safetensors,
    model-00005-of-00017.safetensors, model-00006-of-00017.safetensors,
    model-00007-of-00017.safetensors, model-00008-of-00017.safetensors,
    model-00009-of-00017.safetensors, model-00010-of-00017.safetensors,
    model-00011-of-00017.safetensors, model-00012-of-00017.safetensors,
    model-00013-of-00017.safetensors, model-00014-of-00017.safetensors,
    model-00015-of-00017.safetensors, model-00016-of-00017.safetensors,
    model-00017-of-00017.safetensors,
  ]
  recipe_checkpoint: null
  output_dir: ${output_dir}
  model_type: QWEN2

resume_from_checkpoint: false
save_every_n_steps: 10
save_every_n_epochs: 1

# ── Dataset (identical distribution to Stage 1 + eval, INCLUDING add_uniprot_summary) ──
dataset:
  _component_: torchtune.dev.bioreason.dataset_sft.bioreason_sft_dataset
  data_files: ${sft_data_dir}
  max_seq_len: 6144
  max_protein_len: 2048
  num_go_tokens: 200
  protein_token_id: 151643
  go_token_id: 151644
  train_on_reasoning: true
  inject_go_pred: true
  add_uniprot_summary: true
seed: 1234
shuffle: true
collate_fn: torchtune.dev.bioreason.dataset_sft.bioreason_sft_collate_fn
dataloader_num_workers: 0

# ── Training envelope — conservative lr, mirrors Aurora's stage2 config ────────
epochs: 50
max_steps_per_epoch: null
batch_size: 1
gradient_accumulation_steps: 4
clip_grad_norm: 1.0

optimizer:
  _component_: torch.optim.AdamW
  lr: 2.0e-5
  weight_decay: 0.0
  fused: true

loss:
  _component_: torchtune.modules.loss.LinearCrossEntropyLoss

# ── Distributed / FSDP — full 12-way shard ──────────────────────────────────────
enable_activation_checkpointing: true
enable_activation_offloading: false
fsdp_cpu_offload: false
fsdp_reshard_after_forward: true
data_parallel_replicate_dim: 1
data_parallel_shard_dim: -1
tensor_parallel_dim: 1
pad_to_fixed: true

# ── XPU ───────────────────────────────────────────────────────────────────────
device: xpu
dtype: bf16
compile: false

# ── Logging ───────────────────────────────────────────────────────────────────
log_level: INFO
log_every_n_steps: 1
log_peak_memory_stats: true
metric_logger:
  _component_: torchtune.training.metric_logging.DiskLogger
  log_dir: ${output_dir}/logs

profiler:
  _component_: torchtune.training.setup_torch_profiler
  enabled: false
  output_dir: ${output_dir}/profiling_outputs
  cpu: true
  cuda: false
  profile_memory: false
  with_stack: false
  record_shapes: false
  with_flops: false
  wait_steps: 5
  warmup_steps: 3
  active_steps: 2
  num_cycles: 1
